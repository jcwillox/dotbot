# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

interval: 500ms

tasks:
  default:
    env:
      DRY_RUN: true
      DOTBOT_CONFIG: samples/dotbot.yaml
    cmds:
      - go run ./dotbot {{.CLI_ARGS}}
    silent: true

  run-wsl:
    desc: Run inside WSL
    vars:
      CONFIG: samples/dotbot.yaml
    cmds:
      - wsl -- DRY_RUN=true DOTBOT_CONFIG={{.CONFIG}} go run ./dotbot {{.CLI_ARGS}}
    preconditions:
      - sh: command -v wsl
        msg: "WSL is not installed"
      - sh: wsl -- command -v go
        msg: "go binary is not available in WSL"
    silent: true

  build:
    cmd: go build ./dotbot

  build:watch:
    cmd: go build ./dotbot
    watch: true
    sources:
      - '**/*.go'
    generates:
      - dotbot{{exeExt}}
    method: timestamp

  build:linux:
    env:
      GOOS: linux
      GOARCH: amd64
    cmd: go build ./dotbot

  build:darwin:
    env:
      GOOS: darwin
      GOARCH: arm64
    cmd: go build ./dotbot

  build:all:
    cmd: goreleaser release --clean --snapshot

  docker:
    desc: Build & run docker container
    cmds:
      - docker build -t dotbot .
      - docker run --rm -ti -v /etc/localtime:/etc/localtime:ro --name dotbot dotbot {{.CLI_ARGS}}

  clean:
    desc: Remove temporary files
    cmds:
      - python ./scripts/clean.py

  add_plugin:
    desc: Scaffolds a new plugin
    cmds:
      - python ./scripts/add_plugin.py {{.CLI_ARGS}}

  gen:completions:
    desc: Regenerate completion files
    cmds:
      - go build ./dotbot
      - ./dotbot{{exeExt}} completion bash > ./completions/dotbot.bash
      - ./dotbot{{exeExt}} completion zsh > ./completions/dotbot.zsh
      - ./dotbot{{exeExt}} completion fish > ./completions/dotbot.fish
      - ./dotbot{{exeExt}} completion powershell > ./completions/dotbot.ps1
